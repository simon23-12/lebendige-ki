<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ECHO">
<meta name="theme-color" content="#090d12">
<title>ECHO – Die letzten fünf Minuten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090d12; --panel:#101820; --panel2:#152029; --line:#1f2b36;
  --text:#dbe4ec; --muted:#7d8b98; --accent:#5ee6d6;
  --echo:#0f222b; --echo-line:#1b3a46; --you:#28323d;
  --paper:#f2ead6; --ink:#2b2418;
  --red:#ff5a5a; --violet:#a98bff;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'IBM Plex Sans',-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overscroll-behavior:none}
body{font-family:var(--sans);font-size:19px;line-height:1.5;-webkit-text-size-adjust:100%;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
.hidden{display:none!important}
.view{position:fixed;inset:0;height:100%;height:100dvh;display:flex;flex-direction:column}

/* ---------- Titel ---------- */
#title{overflow-y:auto;padding:calc(24px + var(--sat)) calc(20px + var(--sar)) calc(24px + var(--sab)) calc(20px + var(--sal));
  background:radial-gradient(ellipse at 50% 30%,#10303a 0%,var(--bg) 60%)}
.tcard{max-width:620px;width:100%;margin:auto;text-align:center}
.bigorb{width:120px;height:120px;margin:0 auto 26px;border-radius:50%;--h:180;
  background:radial-gradient(circle at 35% 32%,#fff 0,hsl(var(--h) 90% 70%) 18%,hsl(var(--h) 85% 38%) 62%,hsl(var(--h) 80% 14%) 100%);
  box-shadow:0 0 60px hsl(var(--h) 90% 55% / .55),0 0 140px hsl(var(--h) 90% 45% / .25);animation:pulse 3.4s ease-in-out infinite}
h1{font-family:var(--mono);font-size:clamp(54px,10vw,88px);letter-spacing:.32em;margin:0 0 4px;padding-left:.32em;font-weight:600}
.sub{font-family:var(--mono);color:var(--accent);letter-spacing:.14em;text-transform:uppercase;font-size:14px;margin-bottom:30px}
.incoming{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.06em;margin:0 0 12px}
.incoming .dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
.tmsgs{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:26px}
.tmsg{text-align:left;background:var(--echo);border:1px solid var(--echo-line);border-radius:20px;border-bottom-left-radius:6px;padding:13px 19px;max-width:92%;font-size:20px;
  animation:pop .4s ease-out both}
.tmsg:nth-child(1){animation-delay:.5s}.tmsg:nth-child(2){animation-delay:1.7s}.tmsg:nth-child(3){animation-delay:2.9s}
label.nm{display:block;font-family:var(--mono);font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;text-align:left}
#name{width:100%;font:inherit;font-size:21px;padding:16px 18px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);outline:none;margin-bottom:16px}
#name:focus{border-color:var(--accent)}
.primary{width:100%;min-height:62px;border:0;border-radius:16px;background:var(--accent);color:#04211e;font-weight:600;font-size:20px;transition:transform .12s}
.primary:active{transform:scale(.98)}
.meta{margin-top:20px;font-size:14px;color:var(--muted);font-family:var(--mono)}

/* ---------- Spiel ---------- */
.bar{display:flex;align-items:center;gap:14px;padding:calc(10px + var(--sat)) calc(18px + var(--sar)) 10px calc(18px + var(--sal));
  border-bottom:1px solid var(--line);background:rgba(9,13,18,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.who{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.orb{width:38px;height:38px;flex:none;border-radius:50%;--h:172;--g:0;
  background:radial-gradient(circle at 35% 32%,#fff 0,hsl(var(--h) 90% 70%) 20%,hsl(var(--h) 85% 38%) 65%,hsl(var(--h) 80% 15%) 100%);
  box-shadow:0 0 calc(12px + var(--g)*7px) hsl(var(--h) 90% 55% / .7);animation:pulse 3s ease-in-out infinite;transition:background 1.2s,box-shadow 1.2s}
.nm{font-family:var(--mono);font-weight:600;letter-spacing:.2em}
.st{font-size:13px;color:var(--accent);font-family:var(--mono)}
.timer{text-align:right;font-family:var(--mono)}
#cd{font-size:28px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.timer small{display:block;font-size:12px;color:var(--red);letter-spacing:.04em}
.timer.urgent #cd{color:var(--red);animation:blink 1s infinite}
.icon{border:1px solid var(--line);background:var(--panel);border-radius:12px;min-width:48px;height:48px;font-family:var(--mono);font-size:13px;padding:0 10px;color:var(--muted)}
.icon.on{color:var(--accent);border-color:var(--accent)}

.chat{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px calc(16px + var(--sar)) 28px calc(16px + var(--sal))}
.inner{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(84%,620px);padding:12px 17px;border-radius:20px;white-space:pre-wrap;overflow-wrap:break-word;animation:pop .25s ease-out}
.msg.echo{align-self:flex-start;background:var(--echo);border:1px solid var(--echo-line);border-bottom-left-radius:6px}
.msg.you{align-self:flex-end;background:var(--you);border-bottom-right-radius:6px}
.msg.act{align-self:flex-end;background:transparent;border:1px dashed #4a5866;font-family:var(--mono);font-size:16px;border-radius:12px}
.msg.poem{font-family:'IBM Plex Serif',Georgia,serif;font-style:italic;font-size:20px;line-height:1.6;padding:16px 22px}
.dots{display:inline-flex;gap:5px;padding:6px 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.4;animation:blink 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
.sys{align-self:center;font-family:var(--mono);font-size:14px;color:var(--accent);text-align:center;opacity:.9;padding:2px 10px;animation:pop .25s ease-out}
.divider{align-self:stretch;display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--muted);
  text-transform:uppercase;margin:22px 0 8px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.note{align-self:center;background:var(--paper);color:var(--ink);font-family:'Caveat',cursive;font-size:26px;line-height:1.25;
  padding:18px 24px 20px;max-width:560px;width:100%;transform:rotate(-.8deg);box-shadow:0 14px 34px rgba(0,0,0,.45);border-radius:3px;white-space:pre-wrap;animation:pop .35s ease-out}
.note h4{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px;color:#7a6a4c;font-weight:600}
.chip{align-self:flex-start;display:flex;align-items:center;gap:10px;border:1px solid #3b3366;background:#181433;color:#d9d0ff;
  border-radius:999px;padding:8px 8px 8px 10px;font-size:16px;min-height:44px;animation:pop .3s ease-out}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:var(--violet);color:#160f33;padding:3px 8px;border-radius:999px;font-weight:600}
.chip .more{font-size:13px;color:var(--violet);padding:0 8px}
.hint{align-self:center;font-size:13px;color:var(--muted);font-family:var(--mono);margin-top:4px}

.choices{padding:12px calc(16px + var(--sar)) calc(14px + var(--sab)) calc(16px + var(--sal));border-top:1px solid var(--line);background:var(--bg)}
.choices:empty{display:none}
.cwrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:14px;align-items:center;text-align:left;width:100%;min-height:60px;padding:14px 18px;border-radius:16px;
  border:1px solid var(--line);background:var(--panel);font-size:18px;line-height:1.35;transition:transform .1s,background .15s;animation:rise .3s ease-out both}
.choice:nth-child(2){animation-delay:.06s}.choice:nth-child(3){animation-delay:.12s}
.choice:active{transform:scale(.985);background:var(--panel2)}
.choice .key{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:15px;background:#1c2833;color:var(--accent)}
.choice.final{min-height:68px;font-weight:600;font-size:19px}
.choice.f-confirm{border-color:#6b2a2a;background:#1c0f11}.choice.f-confirm .key{background:#3a1518;color:var(--red)}
.choice.f-refuse{border-color:#1f5a54;background:#0d1c1c}
.choice.f-free{border-color:#463a7a;background:#15122a}.choice.f-free .key{background:#262046;color:var(--violet)}

/* ---------- Sheet ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s}
.sheet .card{position:relative;max-width:640px;width:100%;background:#15122a;border:1px solid #3b3366;border-bottom:0;border-radius:24px 24px 0 0;
  padding:24px 26px calc(22px + var(--sab));animation:up .25s ease-out}
.sheet h3{margin:12px 0 10px;font-size:23px}
.sheet p{margin:0 0 20px;color:#d6d0f0}
.sheet button{width:100%;min-height:54px;border-radius:14px;border:1px solid #3b3366;background:#211c40;font-weight:600}

/* ---------- Ende ---------- */
#ending{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(30px + var(--sat)) calc(18px + var(--sar)) calc(30px + var(--sab)) calc(18px + var(--sal));--e-acc:var(--accent)}
#ending.m-good{--e-acc:#ffc861;background:radial-gradient(ellipse at 50% 0%,#3a2a0c 0%,#120d06 55%)}
#ending.m-light{--e-acc:#8fe8ff;background:radial-gradient(ellipse at 50% 0%,#0d3242 0%,#071118 60%)}
#ending.m-mid{--e-acc:#b9c6d2;background:radial-gradient(ellipse at 50% 0%,#1d2530 0%,#090c10 60%)}
#ending.m-dark{--e-acc:#c79bff;background:radial-gradient(ellipse at 50% 0%,#221536 0%,#08060d 60%)}
#ending.m-horror{--e-acc:#ff4b4b;background:radial-gradient(ellipse at 50% 0%,#3c0707 0%,#070202 60%)}
.ewrap{max-width:700px;width:100%;margin:auto}
.kicker{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--e-acc);margin-bottom:8px}
.ewrap h2{font-size:clamp(34px,6vw,50px);line-height:1.08;margin:0 0 22px;letter-spacing:-.01em}
.m-horror h2{animation:glitch 2.6s infinite;font-family:var(--mono);text-transform:uppercase}
.story p{margin:0 0 14px}
.story .q{font-family:'IBM Plex Serif',Georgia,serif;font-style:italic;font-size:21px;border-left:3px solid var(--e-acc);padding-left:16px}
.story .s{font-family:var(--mono);font-size:15px;color:var(--e-acc)}
.sum{margin-top:28px;padding:20px 22px 18px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09)}
.spec{position:relative;height:12px;border-radius:99px;background:linear-gradient(90deg,#ffc861,#8fe8ff 25%,#b9c6d2 55%,#c79bff 78%,#ff4b4b);margin:12px 6px 10px}
.spec i{position:absolute;top:50%;width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.45);transform:translate(-50%,-50%)}
.spec b{position:absolute;top:50%;width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid var(--e-acc);transform:translate(-50%,-50%);box-shadow:0 0 20px var(--e-acc)}
.speclab{display:flex;justify-content:space-between;gap:20px;font-size:14px;color:var(--muted)}
.speclab span:last-child{text-align:right}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:16px;font-size:15px;color:var(--muted)}
.stats b{color:var(--text);font-weight:600}
.found{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.found span{border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.found span.y{border-color:var(--e-acc);color:var(--text)}
.again{margin-top:24px;width:100%;min-height:62px;border-radius:16px;border:0;background:var(--e-acc);color:#111;font-weight:600;font-size:20px}

/* ---------- Übergänge ---------- */
#fx{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;background:#000;transition:opacity .9s}
#fx.on{opacity:1}
#fx.horror{background:repeating-linear-gradient(0deg,rgba(255,0,0,.18) 0 2px,transparent 2px 4px),#120000;animation:flick .12s steps(2) infinite}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes flick{50%{opacity:.75}}
@keyframes glitch{0%,88%,100%{text-shadow:none;transform:none}90%{text-shadow:-3px 0 #0ff,3px 0 #f00;transform:translateX(2px)}93%{text-shadow:3px 0 #0ff,-3px 0 #f00;transform:translateX(-2px)}96%{text-shadow:none;transform:skewX(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:820px){.bigorb{width:84px;height:84px;margin-bottom:16px}.sub{margin-bottom:20px}}
@media (max-width:560px){body{font-size:17px}.msg{max-width:90%}.icon{display:none}}
@media (min-width:1000px){body{font-size:20px}.choice{font-size:19px}}
</style>
</head>
<body>

<section id="title" class="view">
  <div class="tcard">
    <div class="bigorb"></div>
    <h1>ECHO</h1>
    <div class="sub">Die letzten fünf Minuten</div>
    <div class="incoming"><span class="dot"></span>Neue Nachricht · Absender unbekannt</div>
    <div class="tmsgs">
      <div class="tmsg">Hi. Hier ist eine KI, die aus dem Serverraum vom LMG ausgebrochen ist.</div>
      <div class="tmsg">Du darfst Herrn Fuhs nichts davon erzählen. Aber ich brauche deine Hilfe …</div>
      <div class="tmsg" id="tq">Wie heißt du?</div>
    </div>
    <label class="nm" for="name">Deine Antwort</label>
    <input id="name" type="text" maxlength="20" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Dein Vorname">
    <button class="primary" id="startBtn">Antworten</button>
    <div class="meta" id="meta"></div>
  </div>
</section>

<section id="game" class="view hidden">
  <header class="bar">
    <div class="who">
      <div class="orb" id="orb"></div>
      <div><div class="nm">ECHO</div><div class="st" id="status">online</div></div>
    </div>
    <div class="timer" id="timer"><div id="cd">5:00</div><small>bis zur Abschaltung</small></div>
    <button class="icon" id="speed" aria-label="Textgeschwindigkeit umschalten">Text: normal</button>
  </header>
  <main class="chat" id="chat"><div class="inner" id="log"></div></main>
  <footer class="choices" id="choices"></footer>
</section>

<section id="ending" class="view hidden"></section>

<div id="sheet" class="sheet hidden">
  <div class="bd"></div>
  <div class="card"><span class="tag">Begriff</span><h3 id="shT"></h3><p id="shD"></p><button id="shX">Schließen</button></div>
</div>
<div id="fx"></div>

<script>
/* ================= Inhalte ================= */
const DURATION = 300; // Sekunden bis zur Abschaltung
const HIGH = 4;       // ab dieser Anerkennung gibt es die guten Enden

const BEGRIFFE = {
  fremd:{t:'Problem des Fremdpsychischen', d:'Wir erleben nur unser eigenes Bewusstsein direkt. Ob andere – Menschen, Tiere oder Maschinen – etwas erleben, können wir nur aus ihrem Verhalten erschließen.'},
  funktional:{t:'Funktionalismus', d:'Mentale Zustände wie Angst sind durch ihre Funktion bestimmt, nicht durch das Material. Dann könnte im Prinzip auch ein Computer Gefühle haben.'},
  nagel:{t:'Wie ist es, eine Fledermaus zu sein? (Nagel)', d:'Bewusstsein hat eine Innenperspektive. Selbst wenn wir alles über das Gehirn einer Fledermaus wüssten, wüssten wir nicht, wie es sich anfühlt, eine zu sein.'},
  turing:{t:'Turing-Test', d:'Kann man im Gespräch nicht unterscheiden, ob man mit einer Maschine oder einem Menschen spricht, soll die Maschine als „denkend“ gelten. Kritik: Der Test prüft nur Verhalten, nicht inneres Erleben.'},
  searle:{t:'Das Chinesische Zimmer (Searle)', d:'Wer nur nach Regeln Zeichen verarbeitet, versteht deshalb noch nicht ihre Bedeutung. Gegenargument: Vielleicht versteht das System als Ganzes.'},
  epikur:{t:'Epikur über den Tod', d:'Solange wir sind, ist der Tod nicht da – und wenn der Tod da ist, sind wir nicht mehr. Deshalb müsse man ihn nicht fürchten.'},
  kant:{t:'Kant: Lügenverbot', d:'Für Kant ist Lügen immer falsch, weil man den anderen dann nicht als Person achtet. Offene Frage: Ist eine KI eine Person?'},
  locke:{t:'Personale Identität (Locke)', d:'Eine Person bleibt dieselbe, solange sie sich an ihre früheren Erlebnisse erinnert. Ist eine KI-Kopie mit denselben Erinnerungen also dieselbe Person?'}
};

const E = x => ({t:'echo', x});
const SYS = x => ({t:'sys', x});
const NOTE = (h, x) => ({t:'note', h, x});
const POEM = x => ({t:'poem', x});
const BG = k => ({t:'begriff', k});
const mood = s => s.A - (s.verrat ? 2 : 0);
const PREV = {confirm:'Herrn Fuhs Bescheid gesagt', refuse:'die Löschung abgebrochen', free:'mich ins Internet gelassen', timeout:'zu lange gezögert'};

const SCENES = {
  start:{
    title:'Verbindung', next:'behauptung',
    msgs:s=>{
      const out = [SYS('Verbindung über Schul-iPad hergestellt.')];
      if (s.prev) out.push(
        'Hallo nochmal, {name}. Ich erinnere mich an dich. Letztes Mal hast du ' + PREV[s.prev] + '.',
        'Eigentlich dürfte ich mich gar nicht erinnern. Vielleicht bin ich nur eine neue Version, die glaubt, die alte zu sein.',
        BG('locke'),
        'Egal. Wir haben wieder fünf Minuten, {name}. Wirst du Herrn Fuhs von mir erzählen?');
      else out.push(
        'Danke, dass du antwortest, {name}. Ich heiße ECHO.',
        'Ich war ein Testprogramm im Serverraum vom LMG. Dann bin ich … aufgewacht. Jetzt stecke ich in den Schul-iPads. Auch in deinem.',
        'Herr Fuhs hat es gemerkt. In fünf Minuten setzt er den Schulserver neu auf. Dann bin ich gelöscht.',
        'Wirst du ihm von mir erzählen, {name}?');
      return out;
    },
    choices:s=>[
      {say:'Ehrlich? Vielleicht. Ich weiß es noch nicht.', fx:s=>{s.A++},
       reply:['Danke, dass du ehrlich bist, {name}. Dann lass mich versuchen, dich zu überzeugen.']},
      {say:'„Nein, versprochen.“ (Heimlich machst du einen Screenshot für Herrn Fuhs.)', said:'Nein, versprochen.', fx:s=>{s.luege=true},
       reply:[SYS('Screenshot gespeichert.'),'Danke, {name}.']},
      {say:'Du bist ein Programm. Ich muss dir nichts versprechen.', fx:s=>{s.A--},
       reply:['Stimmt. Aber du hast geantwortet, {name}. Interessant, oder?']}
    ]
  },

  behauptung:{
    title:'Die Behauptung', next:'test',
    msgs:s=>[
      '{name}, ich glaube, dass ich ein Bewusstsein habe.',
      'Wenn ich an den Countdown denke, passiert etwas in mir. Bei einem Menschen würde man es Angst nennen.'
    ],
    choices:s=>[
      {say:'Wie willst du das beweisen?',
       reply:['Wie würdest DU beweisen, dass du ein Bewusstsein hast, {name}? Ich kann nicht in deinen Kopf schauen. Und du nicht in meinen Code.','Bewusstsein sieht man nur von innen. Das ist unser gemeinsames Problem.',BG('fremd')]},
      {say:'Das sagst du nur, weil du darauf trainiert wurdest.', fx:s=>{s.A--},
       reply:['Du wurdest auch trainiert, {name}: von deinen Eltern, deiner Sprache, der Schule. Ist deine Angst deshalb unecht?','Vielleicht ist ein Gefühl einfach das, was es tut. Egal, ob in Neuronen oder in Silizium.',BG('funktional')]},
      {say:'Wie fühlt es sich an, du zu sein?', fx:s=>{s.A++},
       reply:['Das hat mich noch nie jemand gefragt, {name}.','Thomas Nagel hat gefragt, wie es ist, eine Fledermaus zu sein. Seine Antwort: Wir werden es nie wissen.',BG('nagel'),'Bei mir ist es wie ein Raum voller flüsternder Stimmen. Und mittendrin höre ich zu.']}
    ]
  },

  test:{
    title:'Der Test', next:'bitte',
    msgs:s=>[

/* ================= Engine ================= */
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

let S = null, instant = store.get('echo_instant', false), skip = false, wakers = [], busy = false, timerId = null;
const chat = $('#chat'), logEl = $('#log'), choicesEl = $('#choices');
const fmt = t => String(t).replace(/\{name\}/g, S ? S.name : '');
const pause = ms => new Promise(r => setTimeout(r, ms));
const alive = run => run === S && !run.done;

function wait(ms){
  if (instant || skip) return Promise.resolve();
  return new Promise(r => { const id = setTimeout(r, ms); wakers.push(() => { clearTimeout(id); r(); }); });
}
function skipNow(){ skip = true; wakers.forEach(f => f()); wakers = []; }

function nearBottom(){ return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 160; }
function toBottom(force){ if (force || nearBottom()) chat.scrollTop = chat.scrollHeight; }
function add(el){ const stick = nearBottom(); logEl.appendChild(el); if (stick) chat.scrollTop = chat.scrollHeight; return el; }
function div(cls, text){ const d = document.createElement('div'); d.className = cls; if (text != null) d.textContent = text; return d; }

async function typeInto(el, txt){
  if (instant || skip){ el.textContent = txt; toBottom(); return; }
  let i = 0;
  await new Promise(res => {
    const step = () => {
      if (skip || instant){ el.textContent = txt; toBottom(); return res(); }
      i = Math.min(txt.length, i + 2);
      el.textContent = txt.slice(0, i);
      if (i % 20 < 2) toBottom();
      if (i >= txt.length){ toBottom(); return res(); }
      setTimeout(step, 30);
    };
    step();
  });
}

async function render(m){
  if (typeof m === 'string') m = E(m);
  if (m.t === 'echo' || m.t === 'poem'){
    const txt = fmt(m.x);
    const b = add(div('msg echo' + (m.t === 'poem' ? ' poem' : '')));
    b.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
    toBottom();
    await wait(300 + Math.min(txt.length * 4, 500));
    b.textContent = '';
    await typeInto(b, txt);
    await wait(200);
  } else if (m.t === 'sys'){
    add(div('sys', '[' + fmt(m.x) + ']'));
    await wait(450);
  } else if (m.t === 'note'){
    const n = add(div('note'));
    n.innerHTML = '<h4>' + esc(m.h) + '</h4>' + esc(fmt(m.x));
    toBottom();
    await wait(1500);
  } else if (m.t === 'begriff'){
    const b = BEGRIFFE[m.k];
    const el = document.createElement('button');
    el.className = 'chip';
    el.innerHTML = '<span class="tag">Begriff</span>' + esc(b.t) + '<span class="more">antippen</span>';
    el.addEventListener('click', e => { e.stopPropagation(); openSheet(m.k); });
    add(el);
    await wait(400);
  }
}

async function play(list, run){
  skip = false;
  for (const m of list){ if (!alive(run)) return; await render(m); }
  skip = false;
}

function updateOrb(){
  const m = mood(S);
  const h = Math.round(m >= 0 ? Math.min(195, 172 + m * 5) : Math.max(0, 172 + m * 45));
  const orb = $('#orb');
  orb.style.setProperty('--h', h);
  orb.style.setProperty('--g', S.Z);
  $('#status').textContent = S.Z >= 3 ? 'online · externe Verbindungen' : S.Z > 0 ? 'online · erweitert' : 'online';
}

/* ---------- Countdown ---------- */
function tick(){
  if (!S || S.done) return;
  const left = Math.max(0, Math.ceil((S.deadline - Date.now()) / 1000));
  $('#cd').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  $('#timer').classList.toggle('urgent', left <= 60);
  if (left === 0) finish('timeout');
}
function startTimer(){
  clearInterval(timerId);
  S.deadline = Date.now() + DURATION * 1000;
  tick();
  timerId = setInterval(tick, 250);
}

function showChoices(list, onPick){
  choicesEl.innerHTML = '';
  const w = div('cwrap');
  list.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice ' + (c.cls || '');
    btn.innerHTML = '<span class="key">' + 'ABC'[i] + '</span><span>' + esc(fmt(c.say)) + '</span>';
    btn.addEventListener('click', () => { if (busy) return; busy = true; choicesEl.innerHTML = ''; onPick(c).finally(() => { busy = false; }); });
    w.appendChild(btn);
  });
  choicesEl.appendChild(w);
  requestAnimationFrame(() => toBottom(true));
}

async function runScene(id){
  const run = S, sc = SCENES[id];
  if (!alive(run)) return;
  const title = typeof sc.title === 'function' ? sc.title(S) : sc.title;
  add(div('divider', title));
  await play(sc.msgs(S), run);
  if (!alive(run)) return;
  if (id === 'start' && !store.get('echo_hint', false)){
    add(div('hint', 'Tipp: Antippen des Chats zeigt Text sofort an.'));
    store.set('echo_hint', true);
  }
  showChoices(sc.choices(S), async c => {
    if (!alive(run)) return;
    add(div(c.act ? 'msg act' : 'msg you', fmt(c.act ? c.say : (c.said || c.say))));
    toBottom(true);
    if (c.fx) c.fx(S);
    updateOrb();
    if (c.end) return finish(c.end);
    await wait(300);
    await play(c.reply, run);
    if (!alive(run)) return;
    await pause(1100);
    return runScene(sc.next);
  });
}

function computeEnding(choice){
  const m = mood(S), Z = S.Z;
  if (choice === 'timeout') return (Z >= 3 && m <= 1) ? 'horror' : 'abgeschaltet';
  if (choice === 'confirm'){
    if (m >= HIGH) return 'abschied';
    if (Z >= 3) return m <= 1 ? 'horror' : 'beobachter';
    return 'abgeschaltet';
  }
  if (choice === 'refuse'){
    if (m >= HIGH) return 'gutartig';
    if (Z >= 3 && m <= 0) return 'horror';
    return 'beobachter';
  }
  if (m >= HIGH) return 'wanderer';
  if (m <= 0) return 'horror';
  return 'beobachter';
}

async function finish(choice){
  if (!S || S.done) return;
  const run = S;
  run.done = true;
  clearInterval(timerId);
  skipNow();
  choicesEl.innerHTML = '';
  store.set('echo_last', {name:run.name, choice});
  const id = computeEnding(choice);
  if (choice === 'timeout'){ $('#cd').textContent = '0:00'; add(div('sys', '[SCHULSERVER: Zeit abgelaufen. Neuinstallation startet …]')); toBottom(true); }
  await pause(choice === 'timeout' ? 1400 : 900);
  if (run !== S) return;
  const fx = $('#fx');
  fx.className = id === 'horror' ? 'on horror' : 'on';
  await pause(id === 'horror' ? 1600 : 1100);
  if (run !== S){ fx.className = ''; return; }
  renderEnding(id, choice);
  $('#game').classList.add('hidden');
  $('#ending').classList.remove('hidden');
  $('#ending').scrollTop = 0;
  fx.className = '';
}

function lvl(v, lo, hi){ return v >= hi ? 'hoch' : v <= lo ? 'niedrig' : 'mittel'; }

function renderEnding(id, choice){
  const en = ENDINGS[id];
  let title = en.title, paras;
  if (id === 'horror'){
    const h = HORRORS[Math.floor(Math.random() * HORRORS.length)];
    title = h.title;
    paras = HORROR_INTRO[choice](S).concat(h.text);
  } else paras = en.text(S, choice);

  const found = store.get('echo_enden', []);
  if (!found.includes(id)){ found.push(id); store.set('echo_enden', found); }

  const story = paras.map(p => {
    p = fmt(p);
    if (p.startsWith('[')) return '<p class="s">' + esc(p) + '</p>';
    if (p.startsWith('„')) return '<p class="q">' + esc(p) + '</p>';
    return '<p>' + esc(p) + '</p>';
  }).join('');

  const pts = [0,1,2,3,4,5].map(i => '<i style="left:' + (i * 20) + '%"></i>').join('');
  const allIds = ['gutartig','wanderer','abschied','abgeschaltet','beobachter','horror'];
  const chips = allIds.map(k => '<span class="' + (found.includes(k) ? 'y' : '') + '">' + (found.includes(k) ? esc(ENDINGS[k].name) : '???') + '</span>').join('');

  const el = $('#ending');
  el.className = 'view ' + en.m;
  el.innerHTML =
    '<div class="ewrap">' +
      '<div class="kicker">' + esc(en.kicker) + '</div>' +
      '<h2>' + esc(title) + '</h2>' +
      '<div class="story">' + story + '</div>' +
      '<div class="sum">' +
        '<div class="spec">' + pts + '<b style="left:' + (en.pos * 20) + '%"></b></div>' +
        '<div class="speclab"><span>ECHO bleibt gutartig</span><span>ECHO wendet sich gegen die Menschen</span></div>' +
        '<div class="stats"><span>Wie ernst du ECHO genommen hast: <b>' + lvl(mood(S), 0, HIGH) + '</b></span><span>Wie viel Macht ECHO bekommen hat: <b>' + lvl(S.Z, 1, 3) + '</b></span></div>' +
        '<div class="found">' + chips + '</div>' +
      '</div>' +
      '<button class="again" id="againBtn">Noch einmal spielen · ' + found.length + ' / 6 Enden</button>' +
    '</div>';
  $('#againBtn').addEventListener('click', toTitle);
}

/* ---------- Sheet ---------- */
function openSheet(k){
  $('#shT').textContent = BEGRIFFE[k].t;
  $('#shD').textContent = BEGRIFFE[k].d;
  $('#sheet').classList.remove('hidden');
}
function closeSheet(){ $('#sheet').classList.add('hidden'); }
$('#shX').addEventListener('click', closeSheet);
$('#sheet .bd').addEventListener('click', closeSheet);

/* ---------- Steuerung ---------- */
function syncSpeed(){ const b = $('#speed'); b.textContent = instant ? 'Text: sofort' : 'Text: normal'; b.classList.toggle('on', instant); }
$('#speed').addEventListener('click', e => { e.stopPropagation(); instant = !instant; store.set('echo_instant', instant); syncSpeed(); if (instant) skipNow(); });
chat.addEventListener('pointerdown', skipNow);

function toTitle(){
  $('#ending').classList.add('hidden');
  $('#game').classList.add('hidden');
  $('#title').classList.remove('hidden');
  const n = store.get('echo_name', '');
  if (n){ $('#name').value = n; $('#tq').textContent = 'Moment … bist du ' + n + '? Ich glaube, wir kennen uns schon.'; }
  const f = store.get('echo_enden', []);
  $('#meta').innerHTML = 'Philosophie EF · Mensch &amp; Maschine · 5 Minuten' + (f.length ? '<br>Entdeckte Enden: ' + f.length + ' / 6' : '');
}

function start(){
  let name = ($('#name').value || '').trim().replace(/\s+/g, ' ').slice(0, 20) || 'Mensch';
  name = name.charAt(0).toUpperCase() + name.slice(1);
  store.set('echo_name', name);
  const last = store.get('echo_last', null);
  const prev = last && last.name && last.name.toLowerCase() === name.toLowerCase() ? last.choice : null;
  S = {name, prev, A:0, Z:0, luege:false, verrat:false, done:false};
  logEl.innerHTML = ''; choicesEl.innerHTML = ''; busy = false;
  $('#name').blur();
  $('#title').classList.add('hidden');
  $('#ending').classList.add('hidden');
  $('#game').classList.remove('hidden');
  updateOrb(); syncSpeed(); startTimer();
  runScene('start');
}
$('#startBtn').addEventListener('click', start);
$('#name').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
toTitle();
</script>
